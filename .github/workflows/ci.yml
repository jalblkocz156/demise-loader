name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install darklua
        run: |
          curl -sSL -o dl.zip https://github.com/seaofvoices/darklua/releases/download/v0.19.0/darklua-linux-x86_64.zip
          unzip -o -q dl.zip && chmod +x darklua
      - name: Parse check
        run: |
          for f in src/init.lua src/registry.lua src/modules/*.lua; do
            ./darklua process "$f" /tmp/o.lua --config .darklua-parse.json >/dev/null \
              || { echo "::error::$f does not parse"; exit 1; }
          done
      - name: Style check
        run: npx --yes @johnnymorganz/stylua-bin@latest --check src
      - name: selene
        run: |
          url=$(curl -sSL https://api.github.com/repos/Kampfkarren/selene/releases/latest | grep -o 'https://[^"]*linux[^"]*\.zip' | head -1)
          curl -sSL -o selene.zip "$url"
          unzip -o -q selene.zip && chmod +x selene
          ./selene src
