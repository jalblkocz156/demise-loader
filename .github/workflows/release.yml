name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard version and registry
        run: |
          VERSION=$(sed -n 's/^local VERSION = "\(.*\)"$/\1/p' src/init.lua)
          [ -n "$VERSION" ] || { echo "::error::VERSION not found in src/init.lua"; exit 1; }
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::src/init.lua says $VERSION but tag is $GITHUB_REF_NAME"; exit 1
          fi
          grep -q "/v$VERSION/" README.md || { echo "::error::README install line is not v$VERSION"; exit 1; }
          for m in $(sed -n 's/.*module = "\([A-Za-z0-9_]*\)".*/\1/p' src/registry.lua); do
            [ -f "src/modules/$m.lua" ] || { echo "::error::registry references missing src/modules/$m.lua"; exit 1; }
          done

      - name: Install darklua
        run: |
          curl -sSL -o darklua.zip https://github.com/seaofvoices/darklua/releases/download/v0.19.0/darklua-linux-x86_64.zip
          unzip -o -q darklua.zip
          chmod +x darklua
          ./darklua --version

      - name: Parse check
        run: |
          for f in src/init.lua src/registry.lua src/modules/*.lua; do
            ./darklua process "$f" /tmp/parse.out --config .darklua-parse.json >/dev/null || { echo "::error::$f does not parse"; exit 1; }
          done

      - name: Bundle
        run: |
          minify() {
            if ./darklua process "$1" "$2" --config .darklua.json >/dev/null && [ -s "$2" ]; then
              echo "minified $1"
            else
              echo "::warning::darklua failed on $1, copying verbatim"
              cp "$1" "$2"
            fi
          }
          minify src/init.lua dist/loader.lua
          minify src/registry.lua dist/registry.lua
          for f in src/modules/*.lua; do
            minify "$f" "dist/$(basename "$f")"
          done

      - name: Sanity check build
        run: |
          for f in dist/*.lua; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
          done
          echo "loader bytes: $(wc -c < dist/loader.lua) / source bytes: $(wc -c < src/init.lua)"
          SRC=$(wc -c < src/init.lua); OUT=$(wc -c < dist/loader.lua)
          [ "$OUT" -lt $((SRC * 85 / 100)) ] || { echo "::error::loader not minified ($OUT vs $SRC)"; exit 1; }

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loader.lua
            dist/registry.lua
            dist/*.lua
