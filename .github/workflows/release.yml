name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: |
          mkdir -p dist/modules
          cp src/init.lua dist/loader.lua
          for f in src/modules/*.lua; do
            cp "$f" dist/modules/
          done
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loader.lua
            dist/modules/*.lua
